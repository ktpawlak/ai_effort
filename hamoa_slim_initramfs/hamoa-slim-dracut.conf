# hamoa-slim-dracut.conf — minimal UFS-root initramfs for Hamoa (X1E80100)
#
# Build a slim initramfs (≈25 MB / 26 modules) instead of Ubuntu's default
# MODULES=most image (≈82 MB / ~2500 modules).
#
# Usage (build to a SEPARATE file so the working default is never overwritten):
#   sudo dracut --force --conf hamoa-slim-dracut.conf \
#        /boot/initrd.img-$(uname -r).slim $(uname -r)
#
# NOTE: this is a TEST/experimental config. The slim image has NOT been
# confirmed to boot to userspace on this board (see README.md "Results").
# Always test via the one-shot GRUB entry, never as the default initrd.

hostonly=yes
hostonly_mode=strict
compress=zstd

# UFS root-mount chain + Qualcomm platform glue + Ubuntu initramfs infra.
# Everything else UFS needs (phy-qcom-qmp-ufs, gcc, arm-smmu, qnoc interconnect,
# rpmh, tlmm pinctrl, qcom-rpmh-regulator, sd_mod, scsi_mod, ext4, jbd2) is
# compiled BUILTIN in this kernel and therefore not listed here.
drivers="rpmb_core ufshcd_core ufshcd_pltfrm ufs_qcom autofs4 dm_multipath nls_iso8859_1 socinfo tee qcom_rng qcom_glink_smem qrtr qrtr_smd qrtr_mhi mhi rpmsg_ctrl rpmsg_char llcc_qcom"

# force_drivers => dracut writes etc/cmdline.d/20-force_drivers.conf with
# rd.driver.pre=... so the UFS glue is modprobed EARLY rather than relying on
# udev coldplug OF-modalias autoload (ufs_qcom only advertises the
# qcom,sm8550-ufshc / qcom,ufshc fallback aliases, not qcom,x1e80100-ufshc).
force_drivers+=" ufs_qcom ufshcd_pltfrm "

# Drop dracut modules that pull in the network stack / overlayfs / plymouth /
# copymods (the latter is what bloats the default image to ~2500 modules).
omit_dracutmodules="kernel-network-modules overlayfs overlayfs-crypt plymouth copymods simpledrm i18n net-lib"
