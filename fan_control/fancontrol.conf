# fancontrol config for Qualcomm Hamoa IoT EVK
# Temp sensor: cpuss0_top_thermal (hwmon18)
# Fan PWM:     qcom_ec (hwmon0 pwm1+pwm2)
# Curve: <=45C->25%, 75C->100%
INTERVAL=10
DEVPATH=hwmon0=devices/platform/soc@0/bc0000.geniqup/b94000.i2c/i2c-1/1-0076 hwmon18=devices/virtual/thermal/thermal_zone10
DEVNAME=hwmon0=qcom_ec hwmon18=cpuss0_top_thermal
FCTEMPS=hwmon0/pwm1=hwmon18/temp1_input hwmon0/pwm2=hwmon18/temp1_input
FCFANS=hwmon0/pwm1= hwmon0/pwm2=
MINTEMP=hwmon0/pwm1=45 hwmon0/pwm2=45
MAXTEMP=hwmon0/pwm1=75 hwmon0/pwm2=75
MINSTART=hwmon0/pwm1=64 hwmon0/pwm2=64
MINSTOP=hwmon0/pwm1=64 hwmon0/pwm2=64
MINPWM=hwmon0/pwm1=64 hwmon0/pwm2=64
MAXPWM=hwmon0/pwm1=255 hwmon0/pwm2=255
